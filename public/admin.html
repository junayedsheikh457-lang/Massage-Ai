<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Massage-Ai Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f9;color:#252236;font:15px system-ui,Arial}header{background:#4d235f;color:white;padding:22px 16px}main{max-width:980px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 4px 20px #2513300c}input,textarea,button,select{font:inherit;padding:11px;border:1px solid #ddd;border-radius:8px;width:100%;margin:5px 0}button{background:#6b3281;color:white;border:0;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{width:auto}.item{border:1px solid #eee;border-radius:9px;padding:12px;margin:8px 0;overflow-wrap:anywhere}.muted{color:#6c6875;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h2 style="margin:0">💗 Massage-Ai / Fashion Mart</h2><div>Messenger Sales Bot — Admin Panel</div></header><main>
<section class="card"><h3>Admin login</h3><p class="muted">Render-এ সেট করা ADMIN_PASSWORD এখানে লিখুন।</p><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Login / Connect</button><div id="msg" class="muted"></div></section>
<section class="card"><div class="tabs"><button onclick="show('products')">Products</button><button onclick="show('orders')">Orders</button><button onclick="show('discounts')">Discount requests</button></div></section>
<section id="products" class="card"><h3>নতুন পোশাক যোগ করুন</h3><form id="productForm"><input name="name" required placeholder="পোশাকের নাম"><textarea name="description" placeholder="বর্ণনা"></textarea><div class="grid"><input name="price" type="number" min="0" step=".01" required placeholder="দাম (৳)"><input name="stock" type="number" min="0" value="0" placeholder="স্টক"></div><input name="sizes" placeholder="সাইজ (যেমন M, L, XL)"><input name="offer" placeholder="অফার টেক্সট (অনুমোদিত অফার)"><label for="imageFile">পণ্যের ছবি (মোবাইলের Gallery থেকে বাছাই করুন)</label><input id="imageFile" type="file" accept="image/*"><img id="imagePreview" style="max-width:180px;max-height:180px;object-fit:contain" alt="ছবির প্রিভিউ" hidden><p class="muted">ছবি সর্বোচ্চ 3 MB</p><button type="submit">Save product</button></form><h3>Product catalog</h3><div id="productList"></div></section>
<section id="orders" class="card" hidden><h3>Orders</h3><div id="orderList"></div></section><section id="discounts" class="card" hidden><h3>Discount requests</h3><div id="discountList"></div></section>
</main><script>
let token="";function show(id){for(const x of ["products","orders","discounts"])document.getElementById(x).hidden=x!==id;if(token)load(id)}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"content-type":"application/json","authorization":"Bearer "+token,...opts.headers}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
async function login(){token=document.getElementById("pw").value;try{await api("/api/products");document.getElementById("msg").textContent="Connected";await load("products")}catch(e){document.getElementById("msg").textContent=e.message}}
const imageFile=document.getElementById("imageFile"),imagePreview=document.getElementById("imagePreview");
imageFile.onchange=()=>{const f=imageFile.files?.[0];if(!f){imagePreview.hidden=true;return}if(!f.type.startsWith("image/")||f.size>3*1024*1024){alert("ছবি হতে হবে এবং 3 MB-এর কম হতে হবে");imageFile.value="";imagePreview.hidden=true;return}imagePreview.src=URL.createObjectURL(f);imagePreview.hidden=false};
function fileAsDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error("ছবি পড়া যায়নি"));reader.readAsDataURL(file)})}
document.getElementById("productForm").onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));d.price=Number(d.price);d.stock=Number(d.stock);const file=imageFile.files?.[0];d.image_url=file?await fileAsDataUrl(file):"";await api("/api/products",{method:"POST",body:JSON.stringify(d)});e.target.reset();imagePreview.hidden=true;imagePreview.removeAttribute("src");await load("products");alert("পণ্য ও ছবি সেভ হয়েছে")}catch(x){alert(x.message)}};
async function load(type){try{if(type==="products"){const a=await api("/api/products");document.getElementById("productList").innerHTML=a.map(p=>'<div class="item"><b>'+esc(p.name)+'</b> — ৳'+esc(p.price)+' | Stock: '+esc(p.stock)+'<br>'+esc(p.sizes||"")+' '+esc(p.offer||"")+'<br><button onclick="toggleProduct('+p.id+','+(!p.active)+')">'+(p.active?"Hide from AI":"Activate")+'</button></div>').join("")||"No products yet"}if(type==="orders"){const a=await api("/api/orders");document.getElementById("orderList").innerHTML=a.map(o=>'<div class="item"><b>Order #'+o.id+'</b> — '+esc(o.status)+'<br>'+esc(o.customer_name)+' · '+esc(o.phone)+'<br>'+esc(o.address)+'<br>Total: ৳'+esc(o.total)+'</div>').join("")||"No orders yet"}if(type==="discounts"){const a=await api("/api/discounts");document.getElementById("discountList").innerHTML=a.map(d=>'<div class="item"><b>Request #'+d.id+'</b> — '+esc(d.status)+'<br>'+esc(d.customer_message)+'<br><button onclick="discount('+d.id+',\'approved\')">Approve</button><button onclick="discount('+d.id+',\'rejected\')">Reject</button></div>').join("")||"No requests yet"}}catch(e){document.getElementById("msg").textContent=e.message}}
async function toggleProduct(id,active){try{await api("/api/products/"+id,{method:"PATCH",body:JSON.stringify({active})});load("products")}catch(e){alert(e.message)}}
async function discount(id,status){try{await api("/api/discounts/"+id,{method:"PATCH",body:JSON.stringify({status})});load("discounts")}catch(e){alert(e.message)}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
